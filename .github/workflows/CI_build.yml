name: CI_build

on: [push, pull_request]

jobs:
  build:

    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        # TEMP: narrowed to just x64/Release while diagnosing the first
        # build failure -- restore [Release, Debug] x [x64, Win32, ARM64]
        # once this passes.
        build_configuration: [Release]
        build_platform: [x64]

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: MSBuild of plugin dll
      working-directory: vs.proj\
      shell: pwsh
      run: |
        msbuild NppPluginTemplate.vcxproj /m /p:configuration="${{ matrix.build_configuration }}" /p:platform="${{ matrix.build_platform }}" 2>&1 | Tee-Object -FilePath build.log
        $exitCode = $LASTEXITCODE
        Select-String -Path build.log -Pattern "error" | ForEach-Object {
          $line = $_.Line -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
          Write-Output "::error::$line"
        }
        exit $exitCode

    - name: Archive artifacts for x64
      if: matrix.build_platform == 'x64' && matrix.build_configuration == 'Release'
      uses: actions/upload-artifact@v7
      with:
          name: plugin_dll_x64
          path: bin64\htr-xnglo.dll

    - name: Archive artifacts for Win32
      if: matrix.build_platform == 'Win32' && matrix.build_configuration == 'Release'
      uses: actions/upload-artifact@v7
      with:
          name: plugin_dll_x86
          path: bin\htr-xnglo.dll

    - name: Archive artifacts for ARM64
      if: matrix.build_platform == 'ARM64' && matrix.build_configuration == 'Release'
      uses: actions/upload-artifact@v7
      with:
          name: plugin_dll_arm64
          path: arm64\htr-xnglo.dll
